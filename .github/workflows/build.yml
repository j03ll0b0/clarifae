name: Build Clarifae with DTLN and DeepFilterNet (full Android modes 2+3, ubuntu)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential python3 python3-pip wget curl unzip git pkg-config libssl-dev perl libclang-dev llvm

      - name: Setup Rust (nightly with Android targets)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          override: true
          cache: false

      - name: Install cargo-c (upstream build_capi approach for model 3)
        run: |
          cargo install cargo-c || { echo "ERROR: cargo-c install failed"; exit 1; }

      - name: Install cargo-ndk (Android wrapper)
        run: |
          cargo install cargo-ndk || cargo install cargo-ndk@3.5.4 || { echo "ERROR: cargo-ndk install failed"; exit 1; }

      - name: Install cbindgen (for C header generation)
        run: |
          cargo install cbindgen || { echo "ERROR: cbindgen install failed"; exit 1; }

      - name: Download and install Android NDK r27c manually
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/android-ndk
          echo ">> Downloading NDK r27c (expect ~500MB) ..."
          sudo wget --show-progress -O /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip || { echo "ERROR: NDK download failed"; exit 1; }
          FILESIZE=$(stat -c%s /tmp/ndk.zip)
          echo ">> Downloaded size: $FILESIZE bytes"
          [ "$FILESIZE" -gt 300000000 ] || { echo "ERROR: /tmp/ndk.zip too small ($FILESIZE bytes), likely corrupt/incomplete"; exit 1; }
          echo ">> Verifying zip contents quickly ..."
          python3 -m zipfile -l /tmp/ndk.zip >/dev/null 2>&1 || unzip -l /tmp/ndk.zip | head -n5 || { echo "ERROR: zip appears corrupt or unreadable"; exit 1; }
          # Ensure at least one key file is listed (fast check, not full -t)
          unzip -l /tmp/ndk.zip 2>/dev/null | grep -q "build/cmake/android.toolchain.cmake" || { echo "WARNING: zip may be incomplete (key file not listed)"; }
          echo ">> Unzipping ..."
          sudo rm -rf /opt/android-ndk-r27c
          sudo unzip -o /tmp/ndk.zip -d /opt/ || { echo "ERROR: unzip failed"; exit 1; }
          [ -d /opt/android-ndk-r27c ] || { echo "ERROR: /opt/android-ndk-r27c missing after unzip"; ls -la /opt/; exit 1; }
          echo ">> Moving to /opt/android-ndk ..."
          sudo rm -rf /opt/android-ndk
          sudo mv /opt/android-ndk-r27c /opt/android-ndk || { echo "ERROR: mv failed"; exit 1; }
          echo ">> Verifying NDK contents ..."
          [ -f /opt/android-ndk/build/cmake/android.toolchain.cmake ] || { echo "ERROR: toolchain file missing"; ls -la /opt/android-ndk/; exit 1; }
          [ -d /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin ] || { echo "ERROR: llvm toolchain missing"; exit 1; }
          echo ">> NDK ready at /opt/android-ndk ($(du -sh /opt/android-ndk | cut -f1))"

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=/opt/android-ndk" >> $GITHUB_ENV
          echo "TFLITE_DIR=${{ github.workspace }}/tflite_ref" >> $GITHUB_ENV
          echo "DF_DIR=${{ github.workspace }}/models/df/libDF/target/ndk-arm64-v8a/release" >> $GITHUB_ENV

      - name: Fetch RNNoise + optional models
        run: |
          bash scripts/fetch_deps.sh
          bash scripts/fetch_models.sh || true
          ls -la models/dtln/ models/df/

      - name: Stage DeepFilterNet model archive
        run: |
          mkdir -p models/df
          cp models/df/models/DeepFilterNet3_onnx.tar.gz models/df/ || echo "No archive at expected path"
          ls -la models/df/

      - name: Setup TFLite reference / download
        run: |
          mkdir -p tflite_ref/lib tflite_ref/include
          # Try to download a working Android TFLite C library reference; if unavailable, reference directory is set for user to complete
          echo "Reference TFLite SDK at $PWD/tflite_ref (needs libtensorflowlite_c.so + include/c_api.h for full build)" > tflite_ref/lib/README

      - name: Prepare binaries for modes 2 & 3 (32-bit + 64-bit)
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
        run: |
          bash scripts/prepare_modes_2_3.sh 2>&1

      - name: Build with optional backends enabled
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
          CLARIFAE_WITH_DTLN: ON
          CLARIFAE_WITH_DF: ON
          TFLITE_DIR: ${{ github.workspace }}/tflite_ref
          DF_DIR: ${{ github.workspace }}/models/df/libDF/target/ndk-arm64-v8a/release
        run: |
          bash ./build.sh 2>&1 | tail -n30 || { echo "ERROR: build.sh failed"; exit 1; }

      - name: Upload build artifacts (32-bit + 64-bit + x86_64, modes 2 & 3)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clarifae-build-modes-2-3
          path: |
            lib/
            build/
            tflite_ref/lib/
            tflite_ref/include/
            models/df/libDF/target/ndk-arm64-v8a/release/
            models/df/libDF/target/ndk-armeabi-v7a/release/
            models/df/libDF/target/ndk-x86_64/release/
            scripts/
          retention-days: 30

      - name: Verify artifacts
        run: |
          echo "=== Verification ==="
          ls -la lib/*/libclarifae.so 2>/dev/null || echo "No lib/*.so produced"
          find build -name '*.so' 2>/dev/null | head -n5 || echo "No build/*.so"
          echo "=== Workflow finished ==="
