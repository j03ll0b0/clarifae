name: Build Clarifae with DTLN and DeepFilterNet (full Android modes 2+3, ubuntu)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential python3 python3-pip wget curl unzip git pkg-config libssl-dev perl libclang-dev llvm

      - name: Setup Rust (stable with Android targets)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android armv7-linux-androideabi
          override: true
          cache: false

      - name: Install Android Cargo Tools Quick
        run: |
          # Pre-built binaries to skip long source builds
          rustup run stable cargo +stable binstall -y cargo-c cargo-ndk cbindgen || rustup run stable cargo install cargo-c || rustup run stable cargo install cargo-c
          cargo install cargo-ndk || cargo install cargo-ndk@3.5.4 || { echo "ERROR: cargo-ndk install failed"; exit 1; }
          cargo install cbindgen || { echo "ERROR: cbindgen install failed"; exit 1; }

      - name: Export NDK paths dynamically
        run: |
          # Sincronizamos las variables del NDK para evitar el conflicto detectado por cargo-ndk
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}" >> $GITHUB_ENV
          echo "TFLITE_DIR=${{ github.workspace }}/tflite_ref" >> $GITHUB_ENV
          echo "DF_DIR=${{ github.workspace }}/models/df/libDF/target/ndk-arm64-v8a/release" >> $GITHUB_ENV

      - name: Fetch RNNoise + optional models
        run: |
          bash scripts/fetch_deps.sh
          bash scripts/fetch_models.sh || true
          ls -la models/dtln/ models/df/

      - name: Stage DeepFilterNet model archive
        run: |
          mkdir -p models/df
          cp models/df/models/DeepFilterNet3_onnx.tar.gz models/df/ || echo "No archive at expected path"
          ls -la models/df/

      - name: Setup TFLite reference / download
        run: |
          mkdir -p tflite_ref/lib tflite_ref/include
          # Try to download a working Android TFLite C library reference; if unavailable, reference directory is set for user to complete
          echo "Reference TFLite SDK at $PWD/tflite_ref (needs libtensorflowlite_c.so + include/c_api.h for full build)" > tflite_ref/lib/README

      - name: Prepare binaries for modes 2 & 3 (32-bit + 64-bit)
        env:
          # Heredamos el NDK sincronizado desde el paso Export
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          # FORCE ALL DOWNSTREAM TOOLS TO USE THE INSTALLED STABLE TARGETS:
          RUSTUP_TOOLCHAIN: stable
        run: |
          bash scripts/prepare_modes_2_3.sh 2>&1

      - name: Build DeepFilterNet libdf (C-FFI) for Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          bash scripts/build_df.sh 2>&1 || { echo "ERROR: build_df.sh failed"; exit 1; }

      - name: Build with optional backends enabled
        env:
          # Heredamos el NDK sincronizado desde el paso Export
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          RUSTUP_TOOLCHAIN: stable
          CLARIFAE_WITH_DTLN: ON
          CLARIFAE_WITH_DF: ON
          TFLITE_DIR: ${{ github.workspace }}/tflite_ref
          DF_DIR: ${{ github.workspace }}/models/df/libDF
        run: |
          bash ./build.sh 2>&1 || { echo "ERROR: build.sh failed"; exit 1; }

      - name: Package Magisk module
        if: success()
        run: |
          bash scripts/package.sh 2>&1 || { echo "ERROR: package.sh failed"; exit 1; }

      - name: Upload module artifact (v1.1.2, modes 2+3)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clarifae-v1.1.2
          path: |
            dist/clarifae-*.zip
          retention-days: 30

      - name: Verify module artifact
        run: |
          echo "=== Module artifact ==="
          ls -lh dist/clarifae-*.zip 2>/dev/null || echo "No dist/*.zip produced"
          unzip -l dist/clarifae-*.zip 2>/dev/null | head -30 || echo "No zip contents"
          echo "=== Workflow finished ==="
